spring:
  profiles:
    default: memory
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
game:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:7456,http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173}
---
spring:
  config:
    activate:
      on-profile: memory
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
---
spring:
  config:
    activate:
      on-profile: persistent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paodekuai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:game}
    password: ${DB_PASSWORD:localdev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      timeout: 1s
      connect-timeout: 1s
  sql:
    init:
      mode: always
