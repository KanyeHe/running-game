name: running-game

services:
  server:
    image: ${APP_IMAGE:-running-game/server}:${APP_TAG:-0.1.0}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:9060"
    environment:
      SPRING_PROFILES_ACTIVE: persistent
      DB_URL: "jdbc:mysql://mysql:3306/paodekuai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
      DB_USER: game
      DB_PASSWORD: ${DB_PASSWORD:-game123456}
      REDIS_HOST: redis
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      SERVER_SHUTDOWN: graceful
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

